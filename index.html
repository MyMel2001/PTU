<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTU</title>

<style>

:root{
    --bg:#1e1e1e;
    --panel:#252526;
    --toolbar:#181818;
    --text:#ddd;
    --accent:#4da3ff;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    height:100%;
    font-family:system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
}

body{
    display:flex;
    flex-direction:column;
}

header{

    display:flex;
    align-items:center;
    gap:8px;

    background:#111;

    padding:10px;
}

header h1{
    margin:0;
    font-size:18px;
    margin-right:auto;
}

button{

    background:var(--panel);
    color:white;

    border:1px solid #555;

    padding:6px 10px;

    cursor:pointer;

}

button:hover{

    background:var(--accent);

}

#toolbar{

    display:flex;
    flex-wrap:wrap;
    gap:5px;

    padding:8px;

    background:var(--toolbar);

}

main{

    flex:1;

    display:flex;

    min-height:0;

}

textarea{

    width:50%;
    border:none;
    outline:none;

    resize:none;

    background:#111;
    color:#eee;

    padding:20px;

    font:16px monospace;

}

#preview{

    width:50%;

    overflow:auto;

    background:white;
    color:black;

    padding:24px;

}

/* ---------- Preview Styling ---------- */

#preview h1,
#preview h2,
#preview h3{

    margin-top:1.2em;

}

#preview p{

    line-height:1.6;

}

#preview img{

    max-width:100%;
    height:auto;

}

#preview pre{

    background:#222;

    color:white;

    padding:1em;

    overflow:auto;

    border-radius:4px;

}

#preview code{

    background:#eee;

    padding:2px 5px;

    border-radius:3px;

}

#preview pre code{

    background:none;

    padding:0;

}

#preview ul{

    padding-left:30px;

}

#preview blockquote{

    border-left:4px solid #bbb;

    margin-left:0;

    padding-left:12px;

    color:#555;

}

#preview hr{

    border:none;
    border-top:1px solid #ccc;

    margin:2em 0;

}

</style>

</head>

<body>

<header>

<h1>PTU</h1>

<input
type="file"
id="fileInput"
hidden>

<button onclick="fileInput.click()">
Open
</button>

<button onclick="exportHTML()">
Save HTML
</button>

</header>

<div id="toolbar">

<button onclick="prefixLine('# ')">
H1
</button>

<button onclick="prefixLine('## ')">
H2
</button>

<button onclick="prefixLine('### ')">
H3
</button>

<button onclick="wrapSelection('**','**')">
Bold
</button>

<button onclick="wrapSelection('*','*')">
Italic
</button>

<button onclick="wrapSelection('<u>','</u>')">
Underline
</button>

<button onclick="wrapSelection('~~','~~')">
Strike
</button>

<button onclick="insertInlineCode()">
Code
</button>

<button onclick="insertCodeBlock()">
Code Block
</button>

<button onclick="prefixLine('- ')">
List
</button>

<button onclick="insertLink()">
Link
</button>

<button onclick="insertImage()">
Image
</button>

</div>

<main>

<textarea id="editor">

# Welcome to PTU

This editor now has a better Markdown parser.

Try **bold**, *italic*, `inline code`, lists,
images, links and fenced code blocks.

```js
console.log("Hello!");
```
</textarea> <div id="preview"></div>
</main>
<script>
const editor=document.getElementById("editor");
const preview=document.getElementById("preview"); 
const fileInput=document.getElementById("fileInput");

/*----------------------------------------------------------
    HTML Escaping
----------------------------------------------------------*/

function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}


/*----------------------------------------------------------
    Inline Markdown
----------------------------------------------------------*/

function parseInline(text){

    text = escapeHTML(text);

    /*
        Underline is stored literally in the Markdown.
        We restore it after escaping.
    */

    text = text.replace(
        /&lt;u&gt;(.*?)&lt;\/u&gt;/gs,
        "<u>$1</u>"
    );

    // Images

    text = text.replace(
        /!\[(.*?)\]\((.*?)\)/g,
        '<img src="$2" alt="$1" loading="lazy">'
    );

    // Links

    text = text.replace(
        /\[(.*?)\]\((.*?)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
    );

    // Inline code

    text = text.replace(
        /`([^`\n]+?)`/g,
        "<code>$1</code>"
    );

    // Bold

    text = text.replace(
        /\*\*(.+?)\*\*/gs,
        "<strong>$1</strong>"
    );

    // Italic
    // Won't steal the ** markers.

    text = text.replace(
        /(?<!\*)\*([^*\n]+?)\*(?!\*)/g,
        "<em>$1</em>"
    );

    // Strike

    text = text.replace(
        /~~(.+?)~~/gs,
        "<del>$1</del>"
    );

    return text;

}


/*----------------------------------------------------------
    Block Markdown Parser
----------------------------------------------------------*/

function escapeAttribute(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}

function styleText(style){

    const rules=[];

    if(style.backgroundImage){

        const url=style.backgroundImage
            .replace(/\\/g,"\\\\")
            .replace(/"/g,'\\"');

        rules.push(`background-image:url("${url}")`);

    }

    if(style.backgroundColor)
        rules.push(`background-color:${style.backgroundColor}`);

    if(style.textColor)
        rules.push(`color:${style.textColor}`);

    if(style.align)
        rules.push(`text-align:${style.align}`);

    return rules.join(";");

}

function styleAttribute(style){

    const text=styleText(style);

    return text
        ? ` style="${escapeAttribute(text)}"`
        : "";

}

function readStyleDirectives(line){

    const style={};
    let rest=line;
    let match;
    let found=false;

    while(match=rest.match(/^\s*<(bg-img|bg-color|text-color|align)\s+(?:\[([^\]]+)\]|([^>]+))>\s*/i)){

        const name=match[1].toLowerCase();
        const value=(match[2]||match[3]).trim();

        /* Do not permit a directive value to add another CSS declaration. */
        if(value && !/[;{}<>]/.test(value)){

            if(name==="bg-img") style.backgroundImage=value;
            if(name==="bg-color") style.backgroundColor=value;
            if(name==="text-color") style.textColor=value;
            if(name==="align" && /^(left|center|right)$/i.test(value))
                style.align=value.toLowerCase();

        }

        rest=rest.slice(match[0].length);
        found=true;

    }

    return {style,rest,found};

}

function markdownToDocument(markdown){

    markdown =
        markdown.replace(/\r/g,"");

    const lines =
        markdown.split("\n");

    let html=[];
    let documentStyle={};

    let contentStart=0;

    /* Directive-only lines at the beginning style the whole document. */
    while(contentStart<lines.length){

        if(lines[contentStart].trim()===""){

            contentStart++;
            continue;

        }

        const directive=readStyleDirectives(lines[contentStart]);

        if(!directive.found || directive.rest.trim()!=="")
            break;

        Object.assign(documentStyle,directive.style);
        contentStart++;

    }

    let inCode=false;
    let code=[];

    let inList=false;

    let paragraph=[];
    let paragraphStyle={};
    let codeStyle={};

    function flushParagraph(){

        if(paragraph.length===0)
            return;

        html.push(
            "<p"
            + styleAttribute(paragraphStyle)
            + ">"
            +
            parseInline(
                paragraph.join(" ")
            )
            +
            "</p>"
        );

        paragraph=[];
        paragraphStyle={};

    }

    function closeList(){

        if(!inList)
            return;

        html.push("</ul>");

        inList=false;

    }

    for(let line of lines.slice(contentStart)){

        const directive=inCode
            ? {style:{},rest:line,found:false}
            : readStyleDirectives(line);
        let blockStyle={};

        if(directive.found){

            if(paragraph.length)
                flushParagraph();

            line=directive.rest;
            blockStyle=directive.style;

        }

        /*--------------------------
            CODE BLOCKS
        --------------------------*/

        if(line.startsWith("```")){

            flushParagraph();
            closeList();

            if(inCode){

                html.push(
                    "<pre"
                    + styleAttribute(codeStyle)
                    + "><code>"
                    +
                    escapeHTML(
                        code.join("\n")
                    )
                    +
                    "</code></pre>"
                );

                code=[];
                codeStyle={};

                inCode=false;

            }
            else{

                inCode=true;
                codeStyle=blockStyle;

            }

            continue;

        }

        if(inCode){

            code.push(line);

            continue;

        }

        /*--------------------------
            Blank line
        --------------------------*/

        if(line.trim()===""){

            flushParagraph();
            closeList();

            continue;

        }

        /*--------------------------
            Horizontal rule
        --------------------------*/

        if(/^---+$/.test(line.trim())){

            flushParagraph();
            closeList();

            html.push("<hr"+styleAttribute(blockStyle)+">");

            continue;

        }

        /*--------------------------
            Headings
        --------------------------*/

        let match;

        if(match=line.match(/^### (.+)$/)){

            flushParagraph();
            closeList();

            html.push(
                "<h3"+styleAttribute(blockStyle)+">"
                +
                parseInline(match[1])
                +
                "</h3>"
            );

            continue;

        }

        if(match=line.match(/^## (.+)$/)){

            flushParagraph();
            closeList();

            html.push(
                "<h2"+styleAttribute(blockStyle)+">"
                +
                parseInline(match[1])
                +
                "</h2>"
            );

            continue;

        }

        if(match=line.match(/^# (.+)$/)){

            flushParagraph();
            closeList();

            html.push(
                "<h1"+styleAttribute(blockStyle)+">"
                +
                parseInline(match[1])
                +
                "</h1>"
            );

            continue;

        }

        /*--------------------------
            Blockquotes
        --------------------------*/

        if(match=line.match(/^> (.+)$/)){

            flushParagraph();
            closeList();

            html.push(
                "<blockquote"+styleAttribute(blockStyle)+">"
                +
                parseInline(match[1])
                +
                "</blockquote>"
            );

            continue;

        }

        /*--------------------------
            Lists
        --------------------------*/

        if(match=line.match(/^- (.+)$/)){

            flushParagraph();

            if(!inList){

                html.push("<ul>");

                inList=true;

            }

            html.push(
                "<li"+styleAttribute(blockStyle)+">"
                +
                parseInline(match[1])
                +
                "</li>"
            );

            continue;

        }

        closeList();

        /*
            Everything else becomes
            part of a paragraph.
        */

        if(paragraph.length===0)
            paragraphStyle=blockStyle;

        paragraph.push(line.trim());

    }

    flushParagraph();
    closeList();

    /*
        Unclosed code block?
        Still render it.
    */

    if(inCode){

        html.push(
            "<pre"
            + styleAttribute(codeStyle)
            + "><code>"
            +
            escapeHTML(
                code.join("\n")
            )
            +
            "</code></pre>"
        );

    }

    return {
        html:html.join("\n"),
        documentStyle:styleAttribute(documentStyle),
        documentStyleText:styleText(documentStyle)
    };

}

function markdownToHTML(markdown){

    return markdownToDocument(markdown).html;

}

/*----------------------------------------------------------
    Preview
----------------------------------------------------------*/

function update(){

    const document=markdownToDocument(editor.value);

    preview.innerHTML=document.html;
    preview.style.cssText=document.documentStyleText;

}

editor.addEventListener(
    "input",
    update
);


/*----------------------------------------------------------
    Selection Helpers
----------------------------------------------------------*/

function getSelection(){

    return{

        start:editor.selectionStart,

        end:editor.selectionEnd,

        text:editor.value.substring(
            editor.selectionStart,
            editor.selectionEnd
        )

    };

}


function replaceRange(start,end,text){

    editor.value=
        editor.value.substring(0,start)
        +
        text
        +
        editor.value.substring(end);

    editor.focus();

    update();

}


function setCursor(pos){

    editor.selectionStart=
        editor.selectionEnd=
        pos;

}


function selectRange(start,end){

    editor.selectionStart=start;
    editor.selectionEnd=end;

}


/*----------------------------------------------------------
    Wrap Selection
----------------------------------------------------------*/

function wrapSelection(left,right){

    const sel=getSelection();

    const replacement=
        left+
        sel.text+
        right;

    replaceRange(
        sel.start,
        sel.end,
        replacement
    );

    if(sel.text.length===0){

        setCursor(
            sel.start+
            left.length
        );

    }
    else{

        selectRange(
            sel.start,
            sel.start+
            replacement.length
        );

    }

}


/*----------------------------------------------------------
    Prefix Whole Lines
----------------------------------------------------------*/

function prefixLine(prefix){

    let start=
        editor.selectionStart;

    let end=
        editor.selectionEnd;

    let value=
        editor.value;

    let lineStart=
        value.lastIndexOf(
            "\n",
            start-1
        )+1;

    let lineEnd=
        value.indexOf(
            "\n",
            end
        );

    if(lineEnd===-1)
        lineEnd=value.length;

    let block=
        value.substring(
            lineStart,
            lineEnd
        );

    let lines=
        block.split("\n");

    lines=
        lines.map(
            line=>prefix+line
        );

    let replacement=
        lines.join("\n");

    replaceRange(
        lineStart,
        lineEnd,
        replacement
    );

    selectRange(
        lineStart,
        lineStart+
        replacement.length
    );

}


/*----------------------------------------------------------
    Inline Code
----------------------------------------------------------*/

function insertInlineCode(){

    wrapSelection(
        "`",
        "`"
    );

}


/*----------------------------------------------------------
    Code Block
----------------------------------------------------------*/

function insertCodeBlock(){

    const sel=getSelection();

    let text=sel.text;

    if(text===""){

        text="\n";

    }

    const replacement=
`\
\`\`\`
${text}
\`\`\`
`;

    replaceRange(
        sel.start,
        sel.end,
        replacement
    );

    if(sel.text===""){

        setCursor(
            sel.start+4
        );

    }

}


/*----------------------------------------------------------
    Links
----------------------------------------------------------*/

function insertLink(){

    let sel=getSelection();

    let text=
        sel.text ||
        prompt("Link text:");

    if(text===null)
        return;

    let url=
        prompt("URL:");

    if(!url)
        return;

    replaceRange(
        sel.start,
        sel.end,
        `[${text}](${url})`
    );

}


/*----------------------------------------------------------
    Images
----------------------------------------------------------*/

function insertImage(){

    let alt=
        prompt(
            "Image description:"
        ) || "";

    let url=
        prompt(
            "Image URL:"
        );

    if(!url)
        return;

    const md=
        `![${alt}](${url})`;

    replaceRange(
        editor.selectionStart,
        editor.selectionEnd,
        md
    );

}


/*----------------------------------------------------------
    Tab inserts spaces
----------------------------------------------------------*/

editor.addEventListener(
    "keydown",
    function(e){

        if(e.key!=="Tab")
            return;

        e.preventDefault();

        const pos=
            editor.selectionStart;

        replaceRange(
            pos,
            pos,
            "    "
        );

        setCursor(pos+4);

    }
);

/*----------------------------------------------------------
    HTML -> Markdown
----------------------------------------------------------*/

function htmlToMarkdown(html){

    const parser = new DOMParser();

    const doc = parser.parseFromString(
        html,
        "text/html"
    );

    function directivesForStyle(style){

        const directives=[];
        const backgroundImage=
            style.getPropertyValue("background-image").trim();
        const imageMatch=backgroundImage.match(
            /^url\(\s*(?:"([^"]*)"|'([^']*)'|(.+?))\s*\)$/i
        );

        if(imageMatch){

            const url=(
                imageMatch[1]
                ||imageMatch[2]
                ||imageMatch[3]
            ).trim();

            if(url && !/[\[\]]/.test(url))
                directives.push("<bg-img ["+url+"]>");
            else if(url && !/[;{}<>]/.test(url))
                directives.push("<bg-img "+url+">");

        }

        const backgroundColor=
            style.getPropertyValue("background-color").trim();

        if(backgroundColor)
            directives.push("<bg-color "+backgroundColor+">");

        const textColor=
            style.getPropertyValue("color").trim();

        if(textColor)
            directives.push("<text-color "+textColor+">");

        const align=
            style.getPropertyValue("text-align").trim().toLowerCase();

        if(/^(left|center|right)$/.test(align))
            directives.push("<align "+align+">");

        return directives.join("");

    }

    function convert(node){

        if(node.nodeType===Node.TEXT_NODE){

            return node.textContent;

        }

        if(node.nodeType!==Node.ELEMENT_NODE){

            return "";

        }

        const tag =
            node.tagName.toLowerCase();

        const children =
            Array.from(node.childNodes)
            .map(convert)
            .join("");

        const directives=directivesForStyle(node.style);

        switch(tag){

            case "h1":
                return "\n"+directives+"# "+children.trim()+"\n\n";

            case "h2":
                return "\n"+directives+"## "+children.trim()+"\n\n";

            case "h3":
                return "\n"+directives+"### "+children.trim()+"\n\n";

            case "p":
                return directives+children.trim()+"\n\n";

            case "br":
                return "\n";

            case "strong":
            case "b":
                return "**"+children+"**";

            case "em":
            case "i":
                return "*"+children+"*";

            case "u":
                return "<u>"+children+"</u>";

            case "del":
            case "s":
                return "~~"+children+"~~";

            case "code":

                if(node.parentElement &&
                   node.parentElement.tagName.toLowerCase()==="pre")
                    return node.textContent;

                return "`"+node.textContent+"`";

            case "pre":

                return "\n"+directives+"```\n"
                    +node.textContent.replace(/\n$/,"")
                    +"\n```\n\n";

            case "blockquote":

                return directives+children
                    .split("\n")
                    .map(line=>line ? "> "+line : "")
                    .join("\n")
                    +"\n\n";

            case "hr":

                return "\n"+directives+"---\n\n";

            case "a":

                return `[${children}](${node.getAttribute("href")||""})`;

            case "img":

                return `![${node.alt||""}](${node.getAttribute("src")||""})`;

            case "ul":

                return Array.from(node.children)
                    .map(convert)
                    .join("")
                    +"\n";

            case "li":

                return directives+"- "+children.trim()+"\n";

            default:

                return children;

        }

    }

    const documentDirectives=directivesForStyle(doc.body.style);
    const markdown=Array.from(doc.body.childNodes)
        .map(convert)
        .join("");

    return (documentDirectives ? documentDirectives+"\n\n" : "")
        +markdown
        .replace(/\n{3,}/g,"\n\n")
        .trim();

}


/*----------------------------------------------------------
    File Import
----------------------------------------------------------*/

fileInput.addEventListener(
    "change",
    function(e){

        const file=e.target.files[0];

        if(!file)
            return;

        const reader=new FileReader();

        reader.onload=function(){

            const text=reader.result;

            if(file.name.toLowerCase().endsWith(".html")){

                editor.value=
                    htmlToMarkdown(text);

            }
            else{

                editor.value=text;

            }

            update();

        };

        reader.readAsText(file);

    }
);


/*----------------------------------------------------------
    Export HTML
----------------------------------------------------------*/

function exportHTML(){

    const exportedDocument=markdownToDocument(editor.value);

    const html=
`<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>PTU Document</title>

<style>

body{

    font-family:system-ui,sans-serif;

    line-height:1.6;

    max-width:900px;

    margin:40px auto;

    padding:20px;

}

img{

    max-width:100%;
    height:auto;

}

pre{

    background:#222;

    color:white;

    padding:1em;

    overflow:auto;

}

code{

    background:#eee;

    padding:2px 4px;

}

pre code{

    background:none;

    padding:0;

}

blockquote{

    border-left:4px solid #bbb;

    padding-left:12px;

    color:#555;

}

</style>

</head>

<body${exportedDocument.documentStyle}>

${exportedDocument.html}

</body>

</html>`;

    const blob=
        new Blob(
            [html],
            {
                type:"text/html"
            }
        );

    const url=
        URL.createObjectURL(blob);

    const a=
        document.createElement("a");

    a.href=url;

    a.download="document.html";

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(function(){

        URL.revokeObjectURL(url);

    },100);

}


/*----------------------------------------------------------
    Initial Render
----------------------------------------------------------*/

update();
</script>

</body>
</html>
